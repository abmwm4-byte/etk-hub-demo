<script>
const DATA = JSON.parse(document.getElementById('treeData').textContent);
const famTiles = document.getElementById('famTiles');
const genTiles = document.getElementById('genTiles');
const modsBox = document.getElementById('modsBox');
const modsH = document.getElementById('modsH');
let showOld = false;
document.getElementById('oldToggle').addEventListener('change', e => { showOld = e.target.checked; renderFams(); });

function famIsOld(entries) { return entries.every(e => (e.to || e.from || '1900') < '1993'); }
function esc(s) { return (s ?? '').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function yy(a, b) { return a ? a + '—' + (b || '…') : ''; }

function renderFams() {
  famTiles.innerHTML = '';
  for (const [fam, gens] of Object.entries(DATA)) {
    if (!showOld && (fam === 'Классика' || famIsOld(gens))) continue;
    const mcount = gens.reduce((s, g) => s + g.mods.length, 0);
    const d = document.createElement('div');
    d.className = 'tile'; d.dataset.fam = fam;
    d.innerHTML = `<div><div class="tname">${esc(fam)}${fam === 'Классика' || fam === 'Прочее' ? '' : '-класс'}</div><div class="tcnt">${gens.length} покол. · ${mcount} мод.</div></div><div class="dot"></div>`;
    d.onclick = () => { document.querySelectorAll('.tile').forEach(t => t.classList.remove('active')); d.classList.add('active'); renderGens(fam); };
    famTiles.appendChild(d);
  }
}

let curFam = null, curGen = null;
function renderGens(fam) {
  curFam = fam; curGen = null; modsBox.innerHTML = ''; modsH.classList.add('hidden');
  genTiles.classList.remove('empty'); genTiles.innerHTML = '';
  const gens = [...DATA[fam]].sort((a, b) => (a.from || '9999').localeCompare(b.from || '9999'));
  for (const g of gens) {
    const d = document.createElement('div');
    d.className = 'gtile';
    d.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:baseline"><span class="gid">${esc(g.id)}</span><span class="gc">${g.mods.length || 'скоро…'}</span></div>
      <div class="gname">${esc(g.name || g.id)}</div><div class="gy">${yy(g.from, g.to)}</div>`;
    if (g.mods.length) d.onclick = () => { document.querySelectorAll('.gtile').forEach(t => t.classList.remove('active')); d.classList.add('active'); renderMods(fam, g.id); };
    else d.style.cursor = 'default';
    genTiles.appendChild(d);
  }
}

function splitCode(code) {
  const m = (code || '').match(/^([A-Z]\d{3})(\d{3})$/i);
  return m ? [m[1], m[2]] : [code, ''];
}

function sufTip(suf) {
  if (!suf) return '';
  const d1 = suf[1], d2 = suf[2];
  let t = 'Код модификации кузова';
  if (d1 === '3') t += ' — длинная база (L, кузов V-серии)';
  else if (d1 === '0') t += ' — стандартная база (W)';
  if (d2 === '2') t += '; купе';
  else if (d2 === '4') t += '; родстер/кабриолет';
  return t;
}

function renderMods(fam, gid) {
  curGen = gid;
  modsH.classList.remove('hidden');
  const g = DATA[fam].find(x => x.id === gid);
  const genTip = `Серия (Baumuster) ${gid}${g.name ? ' — ' + g.name : ''}`;
  modsBox.innerHTML = `<div class="modstable"><table>
    <thead><tr><th>Серия</th><th>Кузов</th><th>Модификация</th><th style="text-align:right">Годы</th></tr></thead>
    <tbody>${g.mods.map(m => {
      const [gen, suf] = splitCode(m.code);
      return `<tr><td class="code"><span class="csplit" data-tip="${esc(genTip)}">${esc(gen)}</span></td>
        <td class="code"><span class="csplit" data-tip="${esc(sufTip(suf))}">${esc(suf)}</span></td>
        <td>${esc(m.name)}</td><td class="yy">${yy(m.from, m.to)}</td></tr>`; }).join('')}</tbody></table></div>`;
  modsBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

let ctip = null;
document.addEventListener('mouseover', (e) => {
  const el = e.target.closest?.('.csplit');
  if (!el) { if (ctip) ctip.remove(), ctip = null; return; }
  const txt = el.dataset.tip;
  if (!txt) return;
  if (!ctip) { ctip = document.createElement('div'); ctip.id = 'ctip'; document.body.appendChild(ctip); }
  const [t1, ...rest] = txt.split(' — ');
  ctip.innerHTML = `<div class="t1">${esc(el.textContent)}</div><div class="t2">${esc(txt)}</div>`;
  const r = el.getBoundingClientRect();
  ctip.style.left = Math.min(r.left, innerWidth - 310) + 'px';
  ctip.style.top = (r.bottom + 8) + 'px';
});
document.addEventListener('mouseout', (e) => {
  if (e.target.closest?.('.csplit') && ctip) { ctip.remove(); ctip = null; }
});
renderFams();
</script>
</main></body></html>
